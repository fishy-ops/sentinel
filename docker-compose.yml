services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINEL_LLM_BASE_URL: http://ollama:11434/v1
      SENTINEL_LLM_MODEL: qwen2.5:7b
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
